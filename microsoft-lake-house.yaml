version: 1.3.1

type: DeclarativeSource

check:
  type: CheckStream
  stream_names:
    - files

definitions:
  streams:
    files:
      type: DeclarativeStream
      name: files
      primary_key:
        - Name
      retriever:
        type: SimpleRetriever
        requester:
          $ref: "#/definitions/graph_requester"
          path: "/{{ config['container'] }}?restype=container&comp=list&prefix={{ config['prefix'] }}"
          http_method: GET
        record_selector:
          type: RecordSelector
          decoder:
            type: XmlDecoder
          extractor:
            type: DpathExtractor
            field_path:
              - EnumerationResults
              - Blobs
              - Blob
        paginator:
          type: NoPagination
      schema_loader:
        type: InlineSchemaLoader
        schema:
          $ref: "#/schemas/files"

  graph_requester:
    type: HttpRequester
    url_base: "{{ config['base_url'] }}"
    authenticator:
      type: OAuthAuthenticator
      token_refresh_endpoint: "https://login.microsoftonline.com/{{ config['tenant_id'] }}/oauth2/v2.0/token"
      client_id: "{{ config['client_id'] }}"
      client_secret: "{{ config['client_secret'] }}"
      grant_type: "client_credentials"
      refresh_request_body:
        client_id: "{{ config['client_id'] }}"
        client_secret: "{{ config['client_secret'] }}"
        scope: "{{ config['scope'] }}"
        grant_type: "client_credentials"

streams:
  - $ref: "#/definitions/streams/files"

spec:
  type: Spec
  connection_specification:
    $schema: "http://json-schema.org/draft-07/schema#"
    type: object
    additionalProperties: true
    required:
      - base_url
      - container
      - prefix
      - tenant_id
      - client_id
      - client_secret
      - scope
    properties:
      base_url:
        type: string
        title: "Base URL"
      container:
        type: string
        title: "Container"
      prefix:
        type: string
        title: "Path Prefix"
        description: "Path inside the OneLake workspace/item, for example bank_LH.Lakehouse/Tables/bank_DB/transactions/"
      tenant_id:
        type: string
        title: "Tenant ID"
      client_id:
        type: string
        title: "Client ID"
      client_secret:
        type: string
        airbyte_secret: true
        title: "Client Secret"
      scope:
        type: string
        title: "OAuth Scope"
        default: "https://storage.azure.com/.default"

schemas:
  files:
    type: object
    properties:
      Name:
        type: string
      Properties:
        type: object
      Url:
        type: string
